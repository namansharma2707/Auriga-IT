<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ticket Raised Successfully</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4" x-data="successCard()" x-init="initData()">
  <div class="max-w-md w-full bg-white border border-slate-200 rounded-2xl shadow-lg p-6 space-y-6 text-center">
    
    <!-- Success Icon -->
    <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
      </svg>
    </div>

    <!-- Title & Ticket Ref -->
    <div class="space-y-1">
      <h1 class="text-xl font-bold text-slate-800">Support Request Received</h1>
      <p class="text-xs text-slate-500">Your ticket has entered the priority dispatch queue.</p>
      <div class="pt-2">
        <span class="text-xs font-mono font-bold bg-slate-100 text-slate-700 px-3 py-1 rounded-full border border-slate-200" x-text="ticketId"></span>
      </div>
    </div>

    <!-- SLA Guarantee Card -->
    <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 text-left space-y-3">
      <div class="flex justify-between items-center text-xs">
        <span class="text-slate-500 font-medium">Assigned Priority:</span>
        <span :class="priority === 'urgent' ? 'bg-orange-100 text-orange-700' : 'bg-slate-200 text-slate-700'" class="font-bold uppercase px-2 py-0.5 rounded text-[11px]" x-text="priority"></span>
      </div>

      <div class="flex justify-between items-center text-xs">
        <span class="text-slate-500 font-medium">Promised Reply By:</span>
        <span class="font-bold text-slate-800" x-text="formattedDeadline"></span>
      </div>

      <!-- Live SLA Countdown -->
      <div class="border-t border-slate-200 pt-3 flex justify-between items-center text-xs">
        <span class="text-slate-500 font-medium">Response Window:</span>
        <span class="font-bold text-indigo-600" x-text="countdown"></span>
      </div>
    </div>

    <!-- Quick Navigation Actions -->
    <div class="space-y-2 pt-2">
      <a href="submit_ticket.html" class="block w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-semibold rounded-lg text-xs transition shadow-sm">
        Raise Another Ticket
      </a>
      <a href="index.html" class="block w-full py-2 text-slate-600 hover:text-slate-800 font-medium text-xs transition">
        Go to Agent Dashboard &rarr;
      </a>
    </div>

  </div>

  <script>
    function successCard() {
      return {
        ticketId: 'T-SAMPLE',
        priority: 'normal',
        dueAt: null,
        formattedDeadline: '--',
        countdown: '--',

        initData() {
          const params = new URLSearchParams(window.location.search);
          this.ticketId = params.get('ticket_id') || 'T-SUBMITTED';
          this.priority = params.get('priority') || 'normal';
          const dueParam = params.get('due_at');

          if (dueParam) {
            this.dueAt = new Date(dueParam);
            this.formattedDeadline = this.dueAt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', month: 'short', day: 'numeric' });
            this.updateCountdown();
            setInterval(() => this.updateCountdown(), 1000);
          } else {
            this.formattedDeadline = this.priority === 'urgent' ? 'Within 2 Hours' : 'Within 24 Hours';
            this.countdown = this.priority === 'urgent' ? '~ 2h 00m left' : '~ 24h 00m left';
          }
        },

        updateCountdown() {
          if (!this.dueAt) return;
          const diffMs = this.dueAt - new Date();
          if (diffMs <= 0) {
            this.countdown = 'Overdue (Top Priority)';
            return;
          }
          const hours = Math.floor(diffMs / (1000 * 60 * 60));
          const minutes = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
          const seconds = Math.floor((diffMs % (1000 * 60)) / 1000);
          this.countdown = `${hours}h ${minutes}m ${seconds}s remaining`;
        }
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Helpdesk - Submit Ticket & Simulator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen py-10 px-4" x-data="ticketPortal()">
  <div class="max-w-xl mx-auto space-y-6">

    <!-- Header -->
    <div class="text-center space-y-1">
      <h1 class="text-2xl font-bold text-slate-800">IT Support Desk Portal</h1>
      <p class="text-sm text-slate-500">Raise support requests or simulate live traffic for queue testing.</p>
    </div>

    <!-- Live Traffic Simulator Card -->
    <div class="bg-gradient-to-r from-indigo-50 to-purple-50 border border-indigo-200 rounded-xl p-5 shadow-sm space-y-3">
      <div class="flex items-center justify-between gap-4">
        <div>
          <h2 class="text-sm font-bold text-indigo-950 flex items-center gap-1.5">
            <span>⚡</span> Automated Traffic Simulator
          </h2>
          <p class="text-xs text-indigo-700">10 realistic tickets inject karega (har 2 second ke gap par).</p>
        </div>
        <button 
          @click="startSimulation()" 
          :disabled="isSimulating"
          class="text-xs font-semibold px-4 py-2 bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-400 text-white rounded-lg transition shadow-sm whitespace-nowrap">
          <span x-text="isSimulating ? 'Injecting...' : 'Simulate 10 Tickets'"></span>
        </button>
      </div>

      <!-- Simulation Live Progress Bar -->
      <div x-show="isSimulating" x-cloak class="space-y-1.5 pt-2">
        <div class="flex justify-between text-[11px] font-semibold text-indigo-900">
          <span x-text="simStatus"></span>
          <span x-text="`${simProgress} / 10`"></span>
        </div>
        <div class="w-full bg-indigo-200 h-2 rounded-full overflow-hidden">
          <div class="bg-indigo-600 h-full transition-all duration-300" :style="`width: ${(simProgress / 10) * 100}%`"></div>
        </div>
      </div>
    </div>

    <!-- Single Ticket Submission Form -->
    <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm space-y-4">
      <h3 class="text-base font-bold text-slate-800 border-b pb-3">Raise a Support Ticket</h3>

      <!-- Feedback Banner -->
      <div x-show="successMessage" x-cloak class="bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs px-4 py-3 rounded-lg flex items-center justify-between">
        <span x-text="successMessage"></span>
        <button @click="successMessage = ''" class="font-bold text-emerald-900 text-base leading-none">&times;</button>
      </div>

      <form @submit.prevent="submitSingleTicket()" class="space-y-4 text-sm">
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Issue Summary</label>
          <input 
            type="text" 
            x-model="form.title" 
            placeholder="e.g., Laptop won't boot before client demo" 
            required 
            class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Customer / Employee ID</label>
            <input 
              type="text" 
              x-model="form.customer_id" 
              placeholder="EMP-104" 
              required 
              class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Full Name</label>
            <input 
              type="text" 
              x-model="form.customer_name" 
              placeholder="Rahul Sharma" 
              required 
              class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">Email Address</label>
          <input 
            type="email" 
            x-model="form.customer_email" 
            placeholder="rahul@company.com" 
            required 
            class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-2">Priority & Response SLA</label>
          <div class="grid grid-cols-2 gap-3">
            <label 
              :class="form.priority === 'normal' ? 'border-indigo-600 bg-indigo-50/40 ring-1 ring-indigo-600' : 'border-slate-200'" 
              class="flex flex-col p-3 border rounded-lg cursor-pointer hover:bg-slate-50 transition">
              <input type="radio" value="normal" x-model="form.priority" class="hidden">
              <span class="font-bold text-slate-800 text-xs">Normal Request</span>
              <span class="text-[11px] text-slate-500 mt-1">24h Response SLA</span>
            </label>

            <label 
              :class="form.priority === 'urgent' ? 'border-orange-500 bg-orange-50/40 ring-1 ring-orange-500' : 'border-slate-200'" 
              class="flex flex-col p-3 border rounded-lg cursor-pointer hover:bg-slate-50 transition">
              <input type="radio" value="urgent" x-model="form.priority" class="hidden">
              <span class="font-bold text-orange-700 text-xs">Urgent Blocker</span>
              <span class="text-[11px] text-orange-600 mt-1">2h Response SLA</span>
            </label>
          </div>
        </div>

        <button 
          type="submit" 
          class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-2.5 rounded-lg text-sm transition shadow-sm">
          Submit Ticket
        </button>
      </form>
    </div>
  </div>

  <script>
    const API_BASE = 'http://127.0.0.1:8000/api';

    function ticketPortal() {
      return {
        form: {
          title: '',
          customer_id: '',
          customer_name: '',
          customer_email: '',
          priority: 'normal'
        },
        successMessage: '',
        isSimulating: false,
        simProgress: 0,
        simStatus: '',

        mockDataPool: [
          { title: "Laptop won't boot before client demo", priority: "urgent", id: "EMP-101", name: "Aarav Gupta", email: "aarav@company.com" },
          { title: "Requesting external monitor for workstation", priority: "normal", id: "EMP-204", name: "Sunita Meena", email: "sunita@company.com" },
          { title: "VPN session drops repeatedly on client WiFi", priority: "urgent", id: "EMP-103", name: "Rohan Das", email: "rohan@company.com" },
          { title: "Need write permissions on Figma shared folder", priority: "normal", id: "EMP-305", name: "Kavita Rao", email: "kavita@company.com" },
          { title: "Production database connection timeout on port 5432", priority: "urgent", id: "EMP-106", name: "Aarav Gupta", email: "aarav@company.com" },
          { title: "Slack notifications delayed by 20 minutes", priority: "normal", id: "EMP-210", name: "Vikas Jain", email: "vikas@company.com" },
          { title: "Blue Screen (BSOD) during system boot", priority: "urgent", id: "EMP-112", name: "Deepak Rawat", email: "deepak@company.com" },
          { title: "Replacement needed for wireless mouse", priority: "normal", id: "EMP-401", name: "Neha Sen", email: "neha@company.com" },
          { title: "Account 2FA lockout after phone reset", priority: "urgent", id: "EMP-109", name: "Amit Trivedi", email: "amit@company.com" },
          { title: "Audio echo issues during daily standup call", priority: "normal", id: "EMP-208", name: "Pooja Verma", email: "pooja@company.com" }
        ],

        async submitSingleTicket() {
          try {
            const res = await fetch(`${API_BASE}/tickets`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(this.form)
            });
            if (!res.ok) throw new Error("Ticket submission failed");
            const data = await res.json();

            this.successMessage = `Ticket #${data.id} created successfully with ${this.form.priority.toUpperCase()} SLA!`;
            this.form = { title: '', customer_id: '', customer_name: '', customer_email: '', priority: 'normal' };
          } catch (err) {
            alert(err.message);
          }
        },

        async startSimulation() {
          this.isSimulating = true;
          this.simProgress = 0;

          for (let i = 0; i < this.mockDataPool.length; i++) {
            const mock = this.mockDataPool[i];
            this.simStatus = `Injecting: ${mock.title} (${mock.priority.toUpperCase()})`;

            try {
              await fetch(`${API_BASE}/tickets`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  title: mock.title,
                  priority: mock.priority,
                  customer_id: mock.id,
                  customer_name: mock.name,
                  customer_email: mock.email
                })
              });
              this.simProgress = i + 1;
            } catch (err) {
              console.error("Simulator request failed at index " + i, err);
            }

            // Exactly 2 second delay between requests
            if (i < this.mockDataPool.length - 1) {
              await new Promise(resolve => setTimeout(resolve, 2000));
            }
          }

          this.simStatus = "All 10 tickets injected successfully!";
          setTimeout(() => {
            this.isSimulating = false;
            this.simProgress = 0;
            this.simStatus = '';
          }, 3000);
        }
      }
    }
  </script>
</body>
</html>
